[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pse-opendata"
dynamic = ["version"]
description = "Unofficial Python client for the public data of PSE, the Polish transmission system operator: reports API and legacy CSV export, as tidy pandas frames with explicit interval times."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Konrad Waleszczyński" }]
keywords = ["pse", "poland", "electricity", "power-system", "energy-market", "rce", "balancing-market", "open-data", "pandas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-requests", "build>=1.2"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.urls]
Homepage = "https://github.com/kwwaleszczynski-del/pse-opendata"
Documentation = "https://kwwaleszczynski-del.github.io/pse-opendata/"
Changelog = "https://github.com/kwwaleszczynski-del/pse-opendata/blob/main/CHANGELOG.md"

[project.scripts]
pse-opendata = "pse_opendata.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pse_opendata._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pse_opendata = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls the real PSE servers (run with --live)"]
# raised inside pandas 2.x with numpy >= 2.3, not by this package
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pse_opendata"]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src"]
